<!DOCTYPE html>
<html lang="ru">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CMS Lydia: SecureGate — Тесты (RU)</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #222;
            color: #fff;
        }

        .pass {
            color: #00ff00;
            font-weight: bold;
        }

        .fail {
            color: #ff0000;
            font-weight: bold;
        }

        .test-unit {
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        h1 {
            color: #007bff;
        }

        .lang-switcher {
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .lang-switcher a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .lang-switcher a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>CMS Lydia: SecureGate — Набор Тестов</h1>

    <!-- Ссылка на переключение языка -->
    <div class="lang-switcher">
        <span>Язык: <strong>Русский</strong> | </span>
        <a href="index.html">&larr; Switch to English [EN]</a>
    </div>

    <div id="test-results">Запуск автоматических системных тестов...</div>

    <!-- Скрытые элементы для тестирования структуры DOM -->
    <div id="secure-critical" style="display:none;"></div>
    <div id="auth-container" style="display:none;"></div>
    <button id="btn-open-auth-modal" style="display:none;"></button>
    <form id="secure-auth-form" style="display:none;"></form>

    <script type="text/javascript" src="../js/lydia-secure-gate.js"></script>
    <script type="text/javascript">
        window.onload = function () {
            var output = document.getElementById("test-results");
            output.innerHTML = "";

            function assert(condition, message) {
                var div = document.createElement("div");
                div.className = "test-unit";
                if (condition) {
                    div.innerHTML = "[ <span class='pass'>УСПЕШНО</span> ] " + message;
                } else {
                    div.innerHTML = "[ <span class='fail'>ОШИБКА</span> ] " + message;
                }
                output.appendChild(div);
            }

            // --- ЗАПУСК РУССКИХ ТЕСТОВОВ ---
            assert(typeof window.LydiaSecureGate === "function",
                "Ядро класса LydiaSecureGate успешно зарегистрировано в глобальной области видимости.");

            assert(typeof window.requireScript === "function",
                "Асинхронный загрузчик (window.requireScript) доступен для динамических компонентов.");

            var testGate = new LydiaSecureGate({
                criticalBlockId: "secure-critical",
                authContainerId: "auth-container",
                btnOpenId: "btn-open-auth-modal"
            });
            assert(testGate.criticalBlockId === "secure-critical" && testGate.authContainerId === "auth-container",
                "Конфигурация конструктора применилась корректно. СЕЛЕКТОРЫ: успешно.");

            assert(testGate.lang === "ru",
                "Языковой движок правильно определил контекст документа. Текущая локаль: [RU].");

            var currentProtocol = window.location.protocol;
            if (currentProtocol === "file:" || currentProtocol === "http:") {
                assert(window.location.protocol !== "https:",
                    "Обнаружена локальная или небезопасная песочница (" + currentProtocol + "). Движок успешно активировал защитные сценарии.");
            } else {
                assert(window.location.protocol === "https:",
                    "Окружение проверено. Активен зашифрованный канал (HTTPS).");
            }

            testGate._pingServer(function (isServerCapable) {
                if (currentProtocol === "file:") {
                    assert(isServerCapable === false,
                        "Сетевой стек безопасно вернул [FALSE] для локальной файловой системы без зависания интерфейса браузера.");
                } else {
                    assert(typeof isServerCapable === "boolean",
                        "Асинхронная проверка HEAD-запросом завершена. Поддержка HTTPS сервером: " + isServerCapable);
                }
            });
        };
    </script>
</body>

</html>
